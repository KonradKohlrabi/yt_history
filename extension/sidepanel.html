<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZAPI Simple</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <div class="app" id="app">

      <!-- Header -->
      <header class="hero">
        <div class="hero-brand">
          <div class="hero-titles">
            <h1>ZAPI Simple</h1>
            <span class="version-tag">v1.0.0</span>
          </div>
        </div>
      </header>

      <!-- Connection status -->
      <div class="conn-bar" id="connBar">
        <span class="conn-dot" id="connDot"></span>
        <span class="conn-msg" id="connMsg">Checking…</span>
        <a class="conn-link" id="connLink" href="#" style="display:none"
           target="_blank">Go to Google Flow →</a>
      </div>

      <!-- Prompt JSON input -->
      <div class="field">
        <label for="jsonInput" class="field-label">Frames JSON</label>
        <span class="field-hint">
          Paste your <code>frames = [...]</code> array — the extension reads
          <code>id</code> and <code>prompt</code> from each frame.
        </span>
        <textarea
          id="jsonInput"
          rows="10"
          spellcheck="false"
          placeholder='frames = [
  {
    "id": 0,
    "prompt": "A red bicycle on a rainy street"
  },
  {
    "id": 1,
    "prompt": "A watercolor fox in a forest"
  }
]'
        ></textarea>
      </div>

      <!-- Parsed queue preview -->
      <div class="prompt-list-section" id="listSection" style="display:none">
        <div class="list-header">
          <span class="field-label">Queue</span>
          <span class="list-count" id="listCount"></span>
        </div>
        <div class="prompt-list" id="promptList"></div>
      </div>

      <!-- Status -->
      <p class="status" id="status" role="status" aria-live="polite"></p>

      <!-- Download folder -->
      <div class="folder-row">
        <svg viewBox="0 0 24 24" class="folder-icon" fill="currentColor">
          <path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0
                   2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/>
        </svg>
        <div class="input-wrap folder-input-wrap">
          <input
            type="text"
            id="downloadFolder"
            value="zapi-frames"
            placeholder="zapi-frames"
            spellcheck="false"
          />
        </div>
      </div>

      <!-- Timing -->
      <div class="timing-row">
        <span class="timing-label">Delay between prompts</span>
        <div class="input-wrap timing-input-wrap">
          <input type="number" id="waitMin" min="0" step="1" value="5" />
          <span class="suffix">–</span>
        </div>
        <div class="input-wrap timing-input-wrap">
          <input type="number" id="waitMax" min="0" step="1" value="15" />
          <span class="suffix">sec</span>
        </div>
      </div>

      <!-- Actions -->
      <div class="actions">
        <button type="button" id="runBtn" class="btn btn-primary" disabled>
          ▶ Generate All
        </button>
        <button type="button" id="stopBtn" class="btn btn-quiet">
          Stop
        </button>
      </div>

    </div>
    <script src="selectors.js" defer></script>
    <script src="sidepanel.js" defer></script>
  </body>
</html>
